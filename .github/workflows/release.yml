name: Build & Release Multi-Platform Distributables

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      name: Windows (x64)
                    - os: macos-latest
                      name: macOS Apple Silicon (ARM64)
                    - os: macos-13
                      name: macOS Intel (x64)
                    - os: ubuntu-latest
                      name: Linux (x64)

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install Linux System Dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y squashfs-tools libarchive-tools fakeroot dpkg rpm file libasound2-dev

            - name: Install Dependencies
              run: npm ci || npm install

            - name: Build and Package Distributables
              run: |
                  npm run make || npx electron-forge make --targets @electron-forge/maker-zip,@electron-forge/maker-deb

            - name: Release to GitHub Releases
              uses: softprops/action-gh-release@v2
              if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
              with:
                  body_path: CHANGELOG.md
                  files: |
                      out/make/**/*.exe
                      out/make/**/*.zip
                      out/make/**/*.dmg
                      out/make/**/*.AppImage
                      out/make/**/*.deb
                      out/make/**/*.rpm
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Purge Unwanted Metadata Assets
              uses: actions/github-script@v7
              if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const release = await github.rest.repos.getReleaseByTag({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        tag: 'v1.0.0'
                      });
                      for (const asset of release.data.assets) {
                        if (asset.name === 'RELEASES' || asset.name.endsWith('.nupkg')) {
                          console.log(`Deleting unwanted asset: ${asset.name} (id: ${asset.id})`);
                          try {
                            await github.rest.repos.deleteReleaseAsset({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              asset_id: asset.id
                            });
                          } catch (e) {
                            console.error(`Failed to delete asset ${asset.name}:`, e.message);
                          }
                        }
                      }

