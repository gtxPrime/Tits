name: Build & Release Multi-Platform Distributables

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        name: Build on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
        matrix:
            include:
                - os: windows-latest
                  name: Windows (x64)
                - os: macos-latest
                  name: macOS Apple Silicon (ARM64)
                - os: macos-13
                  name: macOS Intel (x64)
                - os: ubuntu-latest
                  name: Linux (x64)

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install Linux System Dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y squashfs-tools libarchive-tools fakeroot dpkg rpm libasound2-dev

            - name: Install Dependencies
              run: npm ci || npm install

            - name: Build and Package Distributables
              run: npm run make

            - name: Release to GitHub Releases
              uses: softprops/action-gh-release@v2
              if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
              with:
                  files: |
                      out/make/**/*.exe
                      out/make/**/*.zip
                      out/make/**/*.dmg
                      out/make/**/*.AppImage
                      out/make/**/*.deb
                      out/make/**/*.rpm
                      out/make/**/*.nupkg
                      out/make/**/RELEASES
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
