<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TITS Companion</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="container">
            <!-- Sleek Minimalist Header (No image logo) -->
            <header class="header">
                <div class="brand">
                    <span class="brand-glyph">&gt;_</span>
                    <span class="brand-title">TITS</span>
                </div>
                <div class="status-pill active" id="global-status-pill">
                    <span class="status-dot"></span>
                    <span id="status-text">Active</span>
                </div>
            </header>

            <!-- Dual Switch Section -->
            <section class="switch-panel">
                <!-- Switch 1: Paste Unblocker -->
                <div class="switch-row">
                    <div class="switch-meta">
                        <div class="switch-name">Paste Unblocker</div>
                        <div class="switch-desc">Unlock inputs & editors (Alt+V)</div>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="toggle-paste-enable" checked />
                        <span class="slider gold"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <!-- Switch 2: Typing Paste -->
                <div class="switch-row">
                    <div class="switch-meta">
                        <div class="switch-name">Typing Paste</div>
                        <div class="switch-desc">Human keystroke simulation</div>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="toggle-typing-paste" />
                        <span class="slider emerald"></span>
                    </label>
                </div>
            </section>

            <!-- Compact Tuning (Speed & Typos) -->
            <section class="tuning-panel">
                <div class="slider-group">
                    <div class="slider-header">
                        <span>Speed</span>
                        <span class="slider-val" id="speed-label">65 ms</span>
                    </div>
                    <input type="range" id="slider-speed" min="20" max="130" value="65" class="range" />
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <span>Typo Rate</span>
                        <span class="slider-val" id="typo-label">4%</span>
                    </div>
                    <input type="range" id="slider-typo" min="0" max="10" value="4" class="range" />
                </div>
            </section>

            <!-- Minimal Action Row -->
            <section class="actions-row">
                <button id="btn-force-paste" class="btn btn-action" title="Force Paste (Alt+V)">Paste</button>
                <button id="btn-human-type" class="btn btn-action" title="Type Paste (Alt+Shift+V)">Type</button>
                <button id="btn-stop-typing" class="btn btn-danger" title="Stop Typing (Esc)">Stop</button>
                <button id="btn-unlock-all" class="btn btn-subtle" title="Deep Unlock (Alt+U)">Unlock</button>
            </section>

            <!-- Discreet Hotkey Reference -->
            <footer class="footer">
                <span>Alt+V Paste</span>
                <span>•</span>
                <span>Alt+Shift+V Type</span>
                <span>•</span>
                <span>Esc Stop</span>
            </footer>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
